services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nox
      POSTGRES_PASSWORD: nox
      POSTGRES_DB: nox
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nox -d nox']
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
